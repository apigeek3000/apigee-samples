[project]
name = "superdemo-backend"
version = "0.1.0"
description = "FastAPI reverse proxy for the Apigee superdemo"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.34.3",
    "google-cloud-secret-manager==2.28.0",
    "httpx==0.28.1",
    "google-adk==1.34.1",
    "sse-starlette==2.1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "respx==0.21.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
