[project]
name = "superdemo-backend"
version = "0.1.0"
description = "FastAPI reverse proxy for the Apigee superdemo"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "google-cloud-secret-manager==2.21.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
